name: Scripture Forge Test
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: admin
            project: chrome-admin
            spec: tests/login/sf_admin_user.spec.ts
          - role: cc_checker
            project: chrome-cc-checker
            spec: tests/login/sf_cc_user.spec.ts
          
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Playwright tests (${{ matrix.role }})
        run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.project }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PLAYWRIGHT_ROLE: ${{ matrix.role }}
          GOOGLE_TOTP_SECRET: ${{ secrets.GOOGLE_TOTP_SECRET }}
          SF_CC_CHECKER_EMAIL: ${{ secrets.SF_CC_CHECKER_EMAIL }}
          SF_CC_CHECKER_PASSWORD: ${{ secrets.SF_CC_CHECKER_PASSWORD }}
          SF_ADMIN_EMAIL: ${{ secrets.SF_ADMIN_EMAIL }}
          SF_ADMIN_PASSWORD: ${{ secrets.SF_ADMIN_PASSWORD }}
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-and-allure-reports-${{ matrix.role }}
          path: |
            reports/playwright-report/
            reports/allure-results/
            reports/allure-report/
            reports/logs/
          retention-days: 30
          
