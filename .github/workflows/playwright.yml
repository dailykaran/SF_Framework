name: Scripture Forge Test
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run admin and CC-checker tests sequentially
        run: >-
          npx playwright test
          tests/login/sf_admin_user.spec.ts
          tests/login/sf_cc_user.spec.ts
          --project=chrome-admin
          --project=chrome-cc-checker
          --workers=1
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          GOOGLE_TOTP_SECRET: ${{ secrets.GOOGLE_TOTP_SECRET }}
          SF_CC_CHECKER_EMAIL: ${{ secrets.SF_CC_CHECKER_EMAIL }}
          SF_CC_CHECKER_PASSWORD: ${{ secrets.SF_CC_CHECKER_PASSWORD }}
          SF_ADMIN_EMAIL: ${{ secrets.SF_ADMIN_EMAIL }}
          SF_ADMIN_PASSWORD: ${{ secrets.SF_ADMIN_PASSWORD }}
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-and-allure-reports
          path: |
            reports/playwright-report/
            reports/allure-results/
            reports/allure-report/
            reports/logs/
          retention-days: 30
          
